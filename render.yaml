# Avaliação no plano gratuito, com dados fictícios e armazenamento temporário.
# Nenhum disco, banco pago ou credencial da Meta está incluído.
services:
  - type: web
    name: central-atendimento
    runtime: node
    plan: free
    autoDeploy: false
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: HOST
        value: 0.0.0.0
      - key: WHATSAPP_MODE
        value: demo
      - key: DATABASE_PATH
        value: /tmp/central-demo.sqlite
      - key: SETUP_TOKEN
        generateValue: true

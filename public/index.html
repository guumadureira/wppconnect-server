async function importHistory(){
  if(localMode){toast('Entre na central conectada para importar histórico.');return;}
  const c=state.conversations.find(c=>c.id===active);if(!c)return;
  const id=c.id,path='/api/conversations/'+encodeURIComponent(id)+'/history-import/';let source='',generation=0;
  modal('Importar histórico · '+c.name,'<p>Conversa individual de '+esc(c.phone)+'. Use o TXT original exportado sem mídia. Importaremos somente os últimos 7 dias, sem enviar mensagens. A IA ficará pausada para conferir o contexto.</p><label class="field">Arquivo TXT<input id="history-file" type="file" accept=".txt,text/plain" required></label><label class="field">Datas do arquivo<select name="dateOrder" id="import-date-order"><option value="dmy">Dia / mês / ano (Brasil)</option><option value="mdy">Mês / dia / ano</option></select></label><label class="field">Quem é o contato neste arquivo?<select name="customerName" id="import-customer" required><option value="">Escolha o arquivo primeiro</option></select></label><p id="import-file-status" role="status"></p><label class="field"><span><input name="participantsConfirmed" type="checkbox" required> Conferi que é esta conversa individual. O nome selecionado é o contato e o outro nome representa a Domum.</span></label>','Conferir prévia',async data=>{
    if(!source)throw Error('Selecione e confira o arquivo TXT.');
    const preview=await api(path+'preview','POST',{text:source,dateOrder:data.get('dateOrder'),customerName:data.get('customerName'),participantsConfirmed:data.get('participantsConfirmed')==='on'});
    setTimeout(()=>modal('Conferir importação','<p><strong>'+esc(preview.customerName)+'</strong> · '+esc(preview.phone)+'</p><p>Domum no arquivo: '+esc(preview.teamNames.join(', ')||'Sem mensagens da equipe neste período')+'</p><p>'+preview.count+' mensagens para importar · '+preview.duplicates+' repetidas · '+preview.ignored+' registros fora do período ou avisos do WhatsApp.</p><div class="hint">'+preview.sample.map(m=>'<p><strong>'+esc(m.author)+'</strong> · '+formatDate(m.created)+'<br>'+esc(m.body.slice(0,300))+'</p>').join('')+'</div><p>A importação não confirma dados do imóvel, não abre a janela de envio e não reativa a IA. Depois de conferir, use Permitir assistência.</p>','Importar nesta conversa',async()=>{const result=await api(path+'confirm','POST',{previewId:preview.previewId,digest:preview.digest,confirmed:true});await refresh();toast(result.imported+' mensagens importadas. IA pausada para conferência.');}),0);
  });
  const fileInput=$('#history-file'),dateInput=$('#import-date-order');
  const inspect=()=>act(async()=>{
    const turn=++generation,file=fileInput.files[0];source='';if(!file)return;
    if(!/\.txt$/i.test(file.name)||file.size>1000000)throw Error('Use um TXT de até 1 MB. Extraia o TXT se recebeu um ZIP.');
    const text=await file.text(),report=await api(path+'inspect','POST',{text,dateOrder:dateInput.value});
    if(turn!==generation||$('#history-file')!==fileInput)return;
    source=text;$('#import-customer').innerHTML='<option value="">Selecione o nome do contato</option>'+report.participants.map(name=>'<option value="'+esc(name)+'">'+esc(name)+'</option>').join('');
    $('#import-file-status').textContent=report.count+' mensagens nos últimos 7 dias. Confira os participantes antes de continuar.';
  });
  fileInput.onchange=inspect;dateInput.onchange=inspect;
}

function messageText(m){
  if(m.direction!=='out'||!m.agent_name||m.agent_name==='Domum · IA')return esc(m.body);
  const bold='*'+m.agent_name+':* ',plain=m.agent_name+': ';
  const prefix=m.body.startsWith(bold)?bold:m.body.startsWith(plain)?plain:null;
  return prefix?'<strong>'+esc(m.agent_name)+':</strong> '+esc(m.body.slice(prefix.length)):esc(m.body);
}

function contactForm(contact,conversation){

      const normalized=String(values.phone||'').replace(/[\s().-]/g,'').replace(/^\+/,'');
      if(!/^[1-9]\d{7,14}$/.test(normalized))throw new Error('Informe o telefone com código do país e DDD.');
      if((state.contacts||[]).some(item=>item.phone===normalized&&item.id!==contact?.id))throw new Error('Esse telefone já está salvo.');
      state.contacts=state.contacts||[];
      if(contact)Object.assign(contact,values,{phone:normalized,updated:Date.now()});
      else state.contacts.push({...values,id:uid(),phone:normalized,created:Date.now(),updated:Date.now()});
      for(const chat of state.conversations)if(chat.phone===normalized)chat.name=values.name;
      persist();render();
    }else{await api('/api/contacts'+(contact?'/'+encodeURIComponent(contact.id):''),contact?'PATCH':'POST',values);await refresh();}

async function openContact(id){

    e.preventDefault();if(sending)return;
    const text=$('#reply').value.trim(),attachment=attachmentDrafts.get(c.id);if(!text&&!attachment)return;
    if(['sticker','audio'].includes(attachment?.kind)&&text){toast('Áudios e figurinhas não têm legenda. Envie o texto separadamente.',true);return;}
    if(!outgoingRequest||outgoingRequest.text!==text||outgoingRequest.chat!==c.id||outgoingRequest.attachmentId!==attachment?.id)outgoingRequest={id:uid(),text,chat:c.id,attachmentId:attachment?.id};
    sending=true;if(e.submitter)e.submitter.disabled=true;
    act(async()=>{
      try{
        if(localMode){state.messages.push({id:uid(),conversation_id:c.id,direction:'out',body:signedName()+': '+text,agent_id:state.user.id,agent_name:signedName(),status:'simulated',created:Date.now()});c.pending_since=null;c.owner_id=c.owner_id||state.user.id;c.updated=Date.now();persist();}
        else{
          const result=await api('/api/conversations/'+encodeURIComponent(c.id)+'/messages','POST',{text,requestId:outgoingRequest.id,attachmentId:attachment?.id});
          if(!['sent','simulated','delivered','read'].includes(result.message.status))throw new Error('Envio anterior não confirmado ou recusado. Confira o histórico antes de tentar novamente.');
        }
        outgoingRequest=null;forceLatest.add(c.id);finishReplyDraft(c.id,text);if(attachmentDrafts.get(c.id)?.id===attachment?.id)attachmentDrafts.delete(c.id);sending=false;
        if(localMode)render();else await refresh();
      }finally{sending=false;const button=$('#reply-form button[type="submit"]');if(button)button.disabled=state.conversations.find(chat=>chat.id===active)?.status!=='open';}
    });
  });
  $('#add-agent')?.addEventListener('click',()=>agentForm());
  document.querySelectorAll('[data-edit-agent]').forEach(b=>b.onclick=()=>agentForm(state.agents.find(a=>a.id===b.dataset.editAgent)));
  $('#settings-form')?.addEventListener('submit',e=>{e.preventDefault();act(async()=>{const minutes=Number(new FormData(e.target).get('minutes'));if(!Number.isInteger(minutes)||minutes<1||minutes>1440)throw new Error('Use um prazo entre 1 e 1440 minutos.');if(localMode){state.settings.minutes=minutes;persist();render();}else{await api('/api/settings','PATCH',{minutes});await refresh();}toast('Prazo atualizado.');});});
  $('#notifications')?.addEventListener('click',()=>act(async()=>{if(!('Notification' in window))throw new Error('Este navegador não oferece notificações.');const permission=await Notification.requestPermission();toast(permission==='granted'?'Avisos ativados enquanto a central estiver aberta.':'Permissão de notificações não concedida.');}));
  $('#check-config')?.addEventListener('click',()=>act(async()=>{connectionReport=await api('/api/connection-status');await refresh();}));
}
function connectionDiagnostic(status){
  const messages={recorded:'Mensagem registrada na central.',other_number:'Evento recebido, mas ignorado: o número do evento é diferente do configurado. O exemplo do painel da Meta também pode usar outro número.',duplicate:'Evento recebido: a mensagem já estava registrada.',invalid_message:'Evento recebido, mas a mensagem não contém identificação ou telefone válidos.',no_new_message:'Evento recebido sem mensagem nova; pode ser uma atualização de status.',signature_rejected:'Evento recusado: assinatura de segurança inválida. Confira o segredo do aplicativo no servidor.',not_configured:'Evento recusado: faltam configurações obrigatórias no servidor.',invalid_payload:'Evento recusado: formato de dados inválido.',payload_too_large:'Evento recusado: tamanho acima do limite.',processing_error:'Evento recebido, mas houve uma falha no processamento.'};
  const lines=[status.missing.length?'Configurações pendentes no servidor: '+status.missing.join(', ')+'.':'Credenciais preenchidas. Envio e recebimento completos ainda precisam de validação.'];
  if(!status.publicHttps)lines.push('É necessário HTTPS público para o webhook da Meta.');
  if(status.lastSendFailure){
    const failure=status.lastSendFailure;
    const source={api:'resposta da API da Meta',delivery:'aviso de falha de entrega da Meta',transport:'falha ao confirmar a resposta da Meta'}[failure.source] || 'envio';
    lines.push('Última falha de envio registrada: '+formatDate(failure.at)+' ('+source+'). '+(failure.code?'Código Meta: '+failure.code+'.':'Não foi recebido um código numérico da Meta.'));
  }
  const w=status.webhook;
  if(w){
    lines.push('Observações desde o início desta execução: '+formatDate(w.startedAt)+'. Os contadores reiniciam com o servidor.');
    lines.push(w.postRequests?'Última requisição recebida: '+formatDate(w.lastRequestAt)+'.':'Nenhum evento chegou ao servidor nesta execução.');
    if(w.lastResult)lines.push(messages[w.lastResult] || 'Confira os contadores abaixo.');
    lines.push('Requisições: '+w.postRequests+' · Aceitas: '+w.acceptedRequests+' · Recusadas: '+w.rejectedRequests+'.');
    lines.push('Mensagens registradas: '+w.recordedMessages+' · Duplicadas: '+w.duplicates+' · Eventos de outro número: '+w.ignoredNumberEvents+'.');
    if(w.lastMessageAt)lines.push('Última mensagem registrada: '+formatDate(w.lastMessageAt)+'. Isso confirma o recebimento; a entrega de respostas continua sendo uma verificação separada.');
    lines.push('Consulta feita em '+formatDate(Date.now())+'. Clique novamente no botão para atualizar.');
  }
  return lines.map(line=>'<p>'+esc(line)+'</p>').join('');
}
function auth(setupRequired){
  if(typeof resetOperatorChat==='function')resetOperatorChat();
  replyDrafts.clear();attachmentDrafts.clear();contextCache.clear();contextOpen.clear();notionDiagnostic=null;emojiOpen=false;
  view='inbox';active=null;filter='open';query='';mobileChat=false;outgoingRequest=null;connectionReport=null;historyDays=7;expandedHistory.clear();
  $('#root').innerHTML='<main class="auth"><div class="brand"><img class="brand-wordmark" src="/assets/domum-wordmark-dark.png" alt="Domum Engenharia"></div><p class="auth-kicker">Central de atendimento</p><h1>'+(setupRequired?'Prepare sua central.':'Bem-vindo de volta.')+'</h1><p>'+(setupRequired?'Cadastre o primeiro administrador para começar.':'Entre com sua conta e escolha quem está atendendo.')+'</p><form id="auth-form">'+(setupRequired?'<label class="field">Nome na assinatura<input name="name" maxlength="80" autocomplete="name" required></label>':'')+'<label class="field">E-mail<input name="email" type="email" autocomplete="username" required></label><label class="field">Senha<input name="password" type="password" maxlength="512" autocomplete="'+(setupRequired?'new-password':'current-password')+'" required></label>'+(setupRequired?'<label class="field">Código de instalação<input name="setupToken" type="password" autocomplete="off"><small>Necessário para instalação remota.</small></label>':'')+(!setupRequired?'<label class="field">Quem está atendendo?<input name="signatureName" maxlength="80" autocomplete="name" placeholder="Seu nome para assinar as mensagens"><small>Se deixar vazio, será usado o nome cadastrado na conta.</small></label>':'')+'<button class="primary">'+(setupRequired?'Criar administrador':'Entrar')+'</button></form><p class="fineprint">A assinatura identifica quem está atendendo nesta sessão.</p><p class="fineprint"><a href="/sobre" target="_blank" rel="noopener">Domum Engenharia</a> · <a href="/privacidade" target="_blank" rel="noopener">Privacidade</a> · <a href="/exclusao-de-dados" target="_blank" rel="noopener">Exclusão de dados</a></p></main>';
  $('#auth-form').onsubmit=e=>{e.preventDefault();const button=e.submitter;button.disabled=true;act(async()=>{try{const data=Object.fromEntries(new FormData(e.target));if(setupRequired)await api('/api/setup','POST',data);await api('/api/login','POST',data);await refresh();}finally{button.disabled=false;}});};
}
async function boot(){
  const requested=new URLSearchParams(location.search).get('conversation');if(requested)requestedConversation=requested;
  if(localMode){loadDemo();return;}
  try{const session=await api('/api/session');if(session.user)await refresh();else{state=null;auth(session.setupRequired);}}
  catch(e){
    state=null;
    $('#root').innerHTML='<main class="auth"><h1>Central indisponível</h1><p>Não foi possível conectar à central. Tente novamente ou explore uma demonstração com dados fictícios.</p><button id="retry-connection" class="primary">Tentar novamente</button><button id="open-demo" class="demo-link">Explorar demonstração</button><p class="fineprint">A demonstração fica neste navegador e não acessa suas conversas nem envia mensagens ao WhatsApp.</p></main>';
    $('#retry-connection').onclick=()=>boot();
    $('#open-demo').onclick=()=>{localMode=true;loadDemo();toast('Demonstração aberta. Nenhuma mensagem será enviada ao WhatsApp.');};
    toast(e.message,true);
  }
}
setInterval(async()=>{
  if(!state||sending||$('#dialog').open)return;
  try{
    if(!localMode){const session=await api('/api/session');if(!session.user){state=null;auth(session.setupRequired);return;}await refresh();}else render();
    if('Notification' in window&&Notification.permission==='granted')for(const c of state.conversations.filter(isOverdue)){const key=c.id+':'+c.pending_since+':'+c.followup_at;if(!notified.has(key)){new Notification('Atendimento pendente',{body:c.name+' · '+owner(c)});notified.add(key);}}
  }catch(e){toast(e.message,true);}
},15000);
boot();
</script>

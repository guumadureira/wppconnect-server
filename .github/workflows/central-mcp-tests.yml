name: Central MCP tests
on:
  pull_request:
    paths:
      - 'central-mcp.mjs'
      - 'test/**'
      - 'server.mjs'
      - '.github/workflows/central-mcp-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
